# Supabase project configuration.
# Edge Function schedules are declared here; the Supabase CLI reads this file
# when running `supabase functions deploy`.

project_id = "cognilion"

# ----------------------------------------------------------------------------
# Local development ports (`supabase start`, used by the pgTAP tests)
# ----------------------------------------------------------------------------
# Shifted from the CLI defaults (5432x) to 5442x so this stack can run beside
# another local Supabase project. Only affects the local stack and CI.

[api]
port = 54421

[db]
port = 54422
shadow_port = 54420

[db.pooler]
port = 54429

[studio]
port = 54423

[inbucket]
port = 54424

[analytics]
port = 54427

# ----------------------------------------------------------------------------
# Edge Functions
# ----------------------------------------------------------------------------

[functions.dispatch-calendar-reminders]
# DISABLED — not in use. `enabled = false` tells `supabase functions deploy`
# to skip this function while keeping its source in the repo. Remove the
# supabase/functions/dispatch-calendar-reminders/ directory to drop it entirely.
enabled = false
verify_jwt = false

[functions.ai-chat]
verify_jwt = true

[functions.send-push]
# Web Push fan-out for the standalone mobile task app, which points at this
# database — so the function has to live in this project, not in that app's.
# Open to any signed-in user (anyone can create a task or complete their own).
# The client sends only a task id, never a recipient list or message text: the
# function re-reads the task with the service role and checks the caller is an
# assignee, the creator, or an admin before sending.
verify_jwt = true

[functions.sort-document]
# Called by the Make.com email-automation scenario, not a browser — there is
# no user JWT. The function authenticates the caller itself via a shared
# secret (x-doc-sort-secret header), so Supabase's JWT gate is disabled.
verify_jwt = false

[functions.import-erp]
# Ingests 4D Wand feed exports. Two callers: the on-prem agent, which has no
# user JWT and authenticates with a shared secret (x-erp-import-secret), and
# the in-app upload screen, which sends a normal Supabase JWT. Supabase's JWT
# gate is therefore off and both paths are authenticated inside the function,
# which also re-checks the Director/Accounting role rather than trusting the
# client. See docs/erp-integration/SPEC.md §2.1.
verify_jwt = false
