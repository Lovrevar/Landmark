# Weekly update pull requests against development, where feature work is merged (CLAUDE.md, Git
# Workflow). Security updates for a published advisory are separate: they are switched on in the
# repository settings (Code security → Dependabot security updates) and open against the default branch.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    # Only versions at least two weeks old, the same rule used when adding dependencies by hand.
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint's peer range stops below TypeScript 6.1 (8.72.1 on 2026-11-05); TypeScript
      # 7 is also the native compiler, a migration of its own. Lift this when typescript-eslint allows it.
      - dependency-name: typescript
        versions: [">=7.0.0"]
      # The runtime is Node 24 (Vercel's build setting and CI); the types follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # React 19 is a planned migration (backlog UI-21): react, react-dom and both @types packages
      # move together, which a per-package bump cannot do.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/tools/voice-prototype"
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    open-pull-requests-limit: 3
    groups:
      # The plugins pin @livekit/agents exactly, so they can only move together.
      livekit:
        patterns: ["@livekit/*"]
      other:
        patterns: ["*"]
        exclude-patterns: ["@livekit/*"]
    ignore:
      # CI only audits this lockfile, nobody runs the prototype there: major bumps of the model
      # client and the compiler wait until someone runs it by hand.
      - dependency-name: openai
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
